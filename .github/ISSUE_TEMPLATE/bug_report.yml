name: Bug report
description: Something in FormhausCore or FormhausUI does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The formhaus-swift version or commit
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, device or simulator, Xcode and Swift version
      placeholder: iOS 26.0, iPhone 17 simulator, Xcode 26.1, Swift 6.2
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Minimal definition
      description: The smallest form definition that shows the problem
      render: json
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The Swift code that uses the definition, if it matters
      render: swift
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen. If `@formhaus/core` or the playground behaves differently, say so.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead, with errors or screenshots
    validations:
      required: true
